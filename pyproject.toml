[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "keycard"
authors = [{name = "mmlado", email = "developer@mmlado.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version", "description"]
requires-python = ">=3.10"

dependencies = [
    "pyscard",
    "ecdsa",
    "cryptography",
    "ber-tlv~=0.0.6"
]

[project.optional-dependencies]
dev = [
    "pytest", 
    "pytest-cov", 
    "coverage",
    "sphinx",
    "sphinx-autodoc-typehints",
    "flake8",
    "mypy",
    "mnemonic",
    "tox"
]

[project.urls]
Homepage = "https://github.com/mmlado/keycard-py"
Documentation = "https://mmlado.github.io/keycard-py/"

[tool.pytest.ini_options]
markers = [
    "card: needs a real card (set KEYCARD_READER)",
    "destructive: resets and initializes the card (set KEYCARD_DESTRUCTIVE=1)",
]
